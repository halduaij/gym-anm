# Controller variant configurations
# Each base controller can have multiple variants through parameter grids

L1:
  class_path: create_algorithmic_diversity.L1_BangBang
  template:
    noisy: false
    delay: 0
    sigma: 0.005
    params: {}
  grid:
    v_threshold: [0.95, 0.96, 0.97]
    noisy: [false, true]
    delay: [0, 2]

L2:
